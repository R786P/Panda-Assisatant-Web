<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>🐼 Panda Assistant</title><style>*{box-sizing:border-box}body{margin:0;background:transparent;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#fff}.panel{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,520px);height:min(78vh,680px);min-width:280px;min-height:360px;background:rgba(22,24,31,.97);border:1px solid rgba(255,255,255,.13);border-radius:26px;box-shadow:0 24px 70px rgba(0,0,0,.55);overflow:hidden;display:flex;flex-direction:column}.header{height:64px;display:flex;align-items:center;gap:12px;padding:0 18px;cursor:grab;user-select:none;background:linear-gradient(135deg,#252936,#171921);border-bottom:1px solid rgba(255,255,255,.09)}.header:active{cursor:grabbing}.panda{font-size:30px}.title{font-weight:800;font-size:19px}.status{margin-left:auto;font-size:12px;color:#62f2a4}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#44e27c;margin-right:5px}.messages{flex:1;overflow:auto;padding:18px}.msg{max-width:88%;padding:13px 15px;margin:0 0 12px;border-radius:17px;line-height:1.45;white-space:pre-wrap;word-break:break-word}.bot{background:#252832;border-top-left-radius:6px}.user{margin-left:auto;background:#5a57f5;border-top-right-radius:6px}.thinking{opacity:.7}.composer{padding:12px 14px 14px;border-top:1px solid rgba(255,255,255,.09);background:#191b23}.input{width:100%;min-height:58px;max-height:150px;resize:vertical;border:1px solid #3a3d49;background:#272a35;color:#fff;border-radius:17px;padding:14px;font:inherit;outline:none}.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:9px}.tools button,.send{border:0;border-radius:13px;padding:11px 8px;font-weight:750;color:#fff;background:#30333f}.send{width:100%;margin-top:9px;background:#5551e8;font-size:15px}.file{display:none}.hint{text-align:center;color:#8e92a1;font-size:11px;margin-top:8px}.resize{position:absolute;right:4px;bottom:4px;width:20px;height:20px;cursor:nwse-resize;opacity:.55}</style></head><body><div class="panel" id="panel"><div class="header" id="drag"><span class="panda">🐼</span><span class="title">Panda Assistant</span><span class="status"><span class="dot"></span>LIVE</span></div><div class="messages" id="messages"><div class="msg bot">👋 Namaste! Main Panda Assistant hoon. Aap Hindi me sawaal pooch sakte ho.</div></div><div class="composer"><textarea id="input" class="input" placeholder="Message likho ya Paste karo..." rows="2"></textarea><div class="tools"><button id="copy">📋 Copy</button><button id="paste">📥 Paste</button><button id="upload">📎 Upload</button><button id="voice">🎙️ Voice</button></div><input id="file" class="file" type="file" accept="image/*,video/*,.txt,.pdf,.doc,.docx"><button id="send" class="send">➤ Send</button><div class="hint" id="hint">Chatbox ko Panda header se drag karke kahin bhi le ja sakte ho.</div></div><div class="resize" id="resize">◢</div></div><script>const panel=document.getElementById('panel'),drag=document.getElementById('drag'),input=document.getElementById('input'),messages=document.getElementById('messages'),file=document.getElementById('file'),hint=document.getElementById('hint');let imageBase64='',mimeType='image/jpeg',dragging=false,resizing=false,dx=0,dy=0,rw=0,rh=0,rx=0,ry=0;function add(t,c){const e=document.createElement('div');e.className='msg '+c;e.textContent=t;messages.appendChild(e);messages.scrollTop=messages.scrollHeight;return e}function send(){const q=input.value.trim();if(!q)return;add(q,'user');input.value='';const w=add('⏳ Jawab aa raha hai...','bot thinking');fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q,image:imageBase64,mime_type:mimeType})}).then(async r=>{const d=await r.json();if(!r.ok)throw Error(d.error||'Server error');w.classList.remove('thinking');w.textContent=d.reply||'Reply empty hai.'}).catch(e=>{w.classList.remove('thinking');w.textContent='🔴 '+e.message})}drag.addEventListener('pointerdown',e=>{dragging=true;drag.setPointerCapture(e.pointerId);const r=panel.getBoundingClientRect();dx=e.clientX-r.left;dy=e.clientY-r.top;panel.style.transform='none';panel.style.left=r.left+'px';panel.style.top=r.top+'px'});drag.addEventListener('pointermove',e=>{if(dragging){panel.style.left=Math.max(4,Math.min(innerWidth-panel.offsetWidth-4,e.clientX-dx))+'px';panel.style.top=Math.max(4,Math.min(innerHeight-panel.offsetHeight-4,e.clientY-dy))+'px'}});drag.addEventListener('pointerup',()=>dragging=false);const resize=document.getElementById('resize');resize.addEventListener('pointerdown',e=>{e.stopPropagation();resizing=true;resize.setPointerCapture(e.pointerId);rw=panel.offsetWidth;rh=panel.offsetHeight;rx=e.clientX;ry=e.clientY});resize.addEventListener('pointermove',e=>{if(resizing){panel.style.width=Math.max(280,rw+e.clientX-rx)+'px';panel.style.height=Math.max(360,rh+e.clientY-ry)+'px'}});resize.addEventListener('pointerup',()=>resizing=false);document.getElementById('send').onclick=send;input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(input.value);hint.textContent='✅ Text copied'}catch{hint.textContent='Clipboard permission nahi mili'}};document.getElementById('paste').onclick=async()=>{try{input.value=await navigator.clipboard.readText();hint.textContent='✅ Paste ho gaya'}catch{hint.textContent='Paste permission allow karo'}};document.getElementById('upload').onclick=()=>file.click();file.onchange=()=>{const f=file.files[0];if(!f)return;mimeType=f.type||'image/jpeg';const r=new FileReader();r.onload=()=>{imageBase64=String(r.result).split(',')[1]||'';hint.textContent='📎 '+f.name+' ready'};r.readAsDataURL(f)};document.getElementById('voice').onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){hint.textContent='Voice recognition available nahi hai';return}const r=new SR();r.lang='hi-IN';r.onstart=()=>hint.textContent='🎙️ Sun raha hoon...';r.onresult=e=>{input.value=e.results[0][0].transcript;hint.textContent='Voice text ready — Send dabao'};r.onerror=()=>hint.textContent='Voice samajh nahi aayi';r.start()};</script></body></html>
